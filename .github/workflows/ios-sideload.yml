name: Build unsigned iPhone IPA

on:
  push:
    branches: [build/ios-sideload]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-sideload-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Hale for sideloading
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_APP_MODE: demo
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check mobile TypeScript and native configuration
        run: |
          bun run --cwd apps/mobile typecheck
          bun run --cwd apps/mobile check:native

      - name: Generate iOS project
        working-directory: apps/mobile
        run: bunx --no-install expo prebuild --platform ios --no-install

      - name: Install iOS pods
        run: pod install --project-directory=apps/mobile/ios

      - name: Compile and package unsigned device IPA
        run: bash apps/mobile/scripts/build-ios-unsigned.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Hale-iPhone-unsigned-${{ github.run_number }}
          path: apps/mobile/build/unsigned/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Hale-iOS-build-log-${{ github.run_number }}
          path: apps/mobile/build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 1
